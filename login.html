<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>เข้าสู่ระบบ | WorkLogs Attendance</title>
  <meta name="application-name" content="WorkLogs Attendance">
  <meta name="theme-color" content="#173a85">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  
  <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="tailwind.min.css?v=20260803-8">
  <link rel="stylesheet" href="style.css?v=20260803-8">
</head>
<body class="login-page min-h-screen text-slate-800 antialiased font-sans">

  <div id="loading-overlay" class="loading-overlay">
    <div class="loader-spinner"></div>
    <p class="mt-4 font-bold text-corporate-900 tracking-wide">กำลังเข้าสู่ระบบ...</p>
  </div>

  <div id="main-content" class="login-shell relative min-h-screen overflow-hidden flex flex-col justify-center">
    
    <!-- Login View -->
    <div id="view-login" class="login-view h-full flex flex-col justify-center items-center">
        <div class="login-card w-full text-center animate-in fade-in slide-in-from-bottom-10 duration-700">
            <div class="mb-6 relative inline-block">
                <img src="favicon.svg" alt="WorkLogs Attendance" class="w-20 h-20 rounded-2xl mx-auto shadow-xl shadow-blue-200">
            </div>
            <h1 class="text-2xl font-extrabold text-corporate-900 mb-2 tracking-tight">WorkLogs Attendance</h1>
            <p class="text-slate-500 text-sm mb-8 font-medium">ระบบลงเวลาปฏิบัติงาน</p>
            
            <form id="formLogin" class="space-y-5 text-left">
                <div class="space-y-4">
                  <div class="relative group">
                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-corporate-900 transition-colors"></i>
                    <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน" required 
                      class="w-full pl-12 pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-corporate-900 focus:bg-white outline-none transition-all font-semibold placeholder:text-slate-400">
                  </div>
                  <div class="relative">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="รหัสผ่าน" class="input-field" required>
                  </div>
                </div>
                <div class="flex items-center justify-between px-1">
                    <div class="flex items-center">
                        <input type="checkbox" id="chkRemember" class="w-5 h-5 text-corporate-700 bg-slate-50 border-slate-200 rounded-lg focus:ring-0" checked>
                        <label for="chkRemember" class="ml-3 text-sm font-bold text-slate-500">จดจำฉัน</label>
                    </div>
                    <!-- <a href="#" class="text-xs font-bold text-blue-600">ลืมรหัสผ่าน?</a> -->
                </div>
                <button type="submit" id="btnLoginSubmit" class="btn-primary mt-7 py-3.5 text-base">เข้าสู่ระบบ <i class="fas fa-chevron-right ml-2 text-sm"></i></button>
            </form>
            <div id="loginErrorMessage" class="hidden mt-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs font-semibold flex items-center justify-between animate-in fade-in">
                <div class="flex items-center gap-2">
                    <i class="fas fa-exclamation-circle text-rose-500 text-sm shrink-0"></i>
                    <span id="loginErrorText"></span>
                </div>
                <button type="button" onclick="resetLoginFormState()" class="ml-2 text-rose-700 font-bold underline shrink-0">ลองใหม่</button>
            </div>
            <div class="login-recovery mt-7 pt-5">
                <button type="button" onclick="forceAppRecovery()" class="text-sm font-bold text-blue-700 hover:text-blue-900 underline underline-offset-4">
                    เข้าระบบไม่ได้ หรือหน้าจอไม่อัปเดต?
                </button>
                <p class="mt-2 text-xs leading-5 text-slate-500">กดเพื่อล้างข้อมูลชั่วคราวและเปิดระบบใหม่ โดยไม่ลบบัญชีที่จดจำไว้</p>
            </div>
        </div>
    </div>
  </div>

  <script defer src="app.js?v=1.3.12-status-ux-20260812"></script>
</body>
</html>
